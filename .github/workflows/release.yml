name: Release

# Релиз по тегу v*: сборка на чистом Windows-раннере, тесты, публикация exe, zip и SHA256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --bin frostshot --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/frostshot.exe "dist/Frostshot-$v-windows-x64.exe"
          Compress-Archive -Path target/release/frostshot.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath "dist/Frostshot-$v-windows-x64.zip"
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          name: Frostshot ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: dist/*
