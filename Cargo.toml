[package]
name = "frostshot"
version = "0.1.0"
edition = "2024"
description = "Free cross-platform screenshot tool: freeze all monitors, select, annotate, copy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kunfuzi/Frostshot"

[dependencies]
ab_glyph = "0.2.32"
arboard = "3.6.1"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
env_logger = "0.11.11"
global-hotkey = "0.8.0"
log = "0.4.34"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
single-instance = "0.3.3"
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
toml = "1.1.6"
tray-icon = "0.25.1"
winit = "0.30.13"
xcap = "0.9.8"

[build-dependencies]
winresource = "0.1.31"
embed-manifest = "1.5.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
panic = "unwind"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
